<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Бойцы</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

#arena {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Здоровье */

#healthUI {
    position: absolute;
    top: 15px;
    left: 3%;
    right: 3%;
    display: flex;
    justify-content: space-between;
    gap: 20px;
    z-index: 10;
}

.healthBox {
    width: 43%;
}

.name {
    color: white;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 5px;
    text-shadow: 2px 2px 3px black;
}

.bar {
    width: 100%;
    height: 18px;
    background: #222;
    border: 2px solid white;
    border-radius: 5px;
    overflow: hidden;
}

.hp {
    height: 100%;
    width: 100%;
    background: #24d63c;
    transition: width 0.15s;
}

#enemyBox {
    text-align: right;
}

#enemyBar {
    margin-left: auto;
}

/* Бойцы */

.fighter {
    position: absolute;
    bottom: 19%;
    width: 125px;
    height: 190px;
    z-index: 5;
    pointer-events: none;
}

.fighter img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

#player {
    left: 22%;
}

#enemy {
    left: 68%;
}

/* Управление */

#controls {
    position: absolute;
    bottom: 25px;
    left: 0;
    width: 100%;
    padding: 0 22px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 20;
}

.controlGroup {
    display: flex;
    gap: 12px;
}

button {
    width: 68px;
    height: 62px;

    border: none;
    border-radius: 15px;

    background: rgba(0,0,0,0.65);
    color: white;

    font-size: 30px;

    border: 2px solid rgba(255,255,255,0.4);

    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}

button:active {
    transform: scale(0.92);
    background: rgba(255,255,255,0.25);
}

/* Сообщение о победе */

#result {
    position: absolute;
    inset: 0;
    z-index: 50;

    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    background: rgba(0,0,0,0.65);

    color: white;
    text-align: center;
}

#result h1 {
    font-size: 42px;
    margin: 0 0 20px;
}

#restart {
    width: 180px;
    height: 55px;
    font-size: 20px;
}

/* Небольшая вспышка при попадании */

.hitEffect {
    position: absolute;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
    pointer-events: none;
    animation: hitFlash 0.15s forwards;
    z-index: 30;
}

@keyframes hitFlash {
    from {
        opacity: 1;
        transform: scale(0.5);
    }

    to {
        opacity: 0;
        transform: scale(1.5);
    }
}
</style>
</head>

<body>

<div id="game">

    <!-- Арена -->
    <img
        id="arena"
        src="file_00000000558881f4a120c96c574dc0e7.png"
    >

    <!-- Здоровье -->
    <div id="healthUI">

        <div class="healthBox">
            <div class="name">ИГРОК</div>

            <div class="bar">
                <div id="playerHP" class="hp"></div>
            </div>
        </div>

        <div id="enemyBox" class="healthBox">
            <div class="name">БОТ</div>

            <div class="bar">
                <div id="enemyHP" class="hp"></div>
            </div>
        </div>

    </div>

    <!-- Игрок -->
    <div id="player" class="fighter">
        <img
            id="playerImg"
            src="file_00000000af9081f4bb30375a6f7dff03.png"
        >
    </div>

    <!-- Бот -->
    <div id="enemy" class="fighter">
        <img
            id="enemyImg"
            src="file_00000000464081f4b6b2f512e35f627f.png"
        >
    </div>

    <!-- Управление -->
    <div id="controls">

        <div class="controlGroup">
            <button id="left">◀️</button>
            <button id="right">▶️</button>
        </div>

        <div class="controlGroup">
            <button id="attack">🥊</button>
            <button id="block">🛡️</button>
        </div>

    </div>

    <!-- Конец боя -->
    <div id="result">

        <h1 id="resultText">ПОБЕДА!</h1>

        <button id="restart">
            Ещё раз
        </button>

    </div>

</div>


<script>

/* =========================
   НАСТРОЙКИ
========================= */

const PLAYER_IDLE =
    "file_00000000af9081f4bb30375a6f7dff03.png";

const PLAYER_ATTACK =
    "file_00000000eacc8210a6fbcecb836fbcf4.png";

const ENEMY_IDLE =
    "file_00000000464081f4b6b2f512e35f627f.png";

const ENEMY_ATTACK =
    "file_00000000e1888210802cd810fbcfc02a.png";


const MAX_HP = 100;
const DAMAGE = 10;

const ATTACK_COOLDOWN = 1000;
const ATTACK_DURATION = 500;


/* =========================
   СОСТОЯНИЕ ИГРЫ
========================= */

let playerHP = MAX_HP;
let enemyHP = MAX_HP;

let playerX = 22;
let enemyX = 68;

let playerAttacking = false;
let enemyAttacking = false;

let lastPlayerAttack = 0;
let lastEnemyAttack = 0;

let gameOver = false;

let keys = {
    left: false,
    right: false
};


/* =========================
   ЭЛЕМЕНТЫ
========================= */

const player = document.getElementById("player");
const enemy = document.getElementById("enemy");

const playerImg = document.getElementById("playerImg");
const enemyImg = document.getElementById("enemyImg");

const playerHPBar = document.getElementById("playerHP");
const enemyHPBar = document.getElementById("enemyHP");

const result = document.getElementById("result");
const resultText = document.getElementById("resultText");


/* =========================
   ПОЗИЦИИ
========================= */

function updatePositions() {

    player.style.left = playerX + "%";
    enemy.style.left = enemyX + "%";
}


/* =========================
   ДВИЖЕНИЕ ИГРОКА
========================= */

function movePlayer() {

    if (gameOver) return;

    const speed = 0.35;

    if (keys.left) {
        playerX -= speed;
    }

    if (keys.right) {
        playerX += speed;
    }

    /*
       Не даём игроку выйти
       за границы арены.
    */

    playerX = Math.max(4, Math.min(78, playerX));

    updatePositions();
}


/* =========================
   ДИСТАНЦИЯ
========================= */

function getDistance() {

    return Math.abs(enemyX - playerX);
}


/*
   Удар проходит только если
   бойцы достаточно близко.
*/

function canHit() {

    return getDistance() <= 13;
}


/* =========================
   ЭФФЕКТ ПОПАДАНИЯ
========================= */

function hitEffect(target) {

    const effect = document.createElement("div");

    effect.className = "hitEffect";

    effect.style.left =
        (target.offsetLeft + target.offsetWidth / 2) + "px";

    effect.style.top =
        (target.offsetTop + target.offsetHeight / 2) + "px";

    document.getElementById("game").appendChild(effect);

    setTimeout(() => {
        effect.remove();
    }, 160);
}


/* =========================
   УДАР ИГРОКА
========================= */

function playerAttack() {

    if (gameOver) return;

    const now = Date.now();

    /*
       Нельзя атаковать чаще,
       чем один раз в секунду.
    */

    if (now - lastPlayerAttack < ATTACK_COOLDOWN) {
        return;
    }

    if (playerAttacking) return;

    lastPlayerAttack = now;

    playerAttacking = true;

    /*
       Меняем стойку на картинку удара.
    */

    playerImg.src = PLAYER_ATTACK;

    /*
       Сам момент попадания —
       примерно в середине анимации.
    */

    setTimeout(() => {

        if (gameOver) return;

        if (canHit()) {

            enemyHP -= DAMAGE;

            enemyHP = Math.max(0, enemyHP);

            enemyHPBar.style.width =
                enemyHP + "%";

            hitEffect(enemy);

            if (enemyHP <= 0) {
                finishGame(true);
            }
        }

    }, 250);


    /*
       Через 0.5 секунды
       возвращаем обычную стойку.
    */

    setTimeout(() => {

        playerAttacking = false;

        if (!gameOver) {
            playerImg.src = PLAYER_IDLE;
        }

    }, ATTACK_DURATION);
}


/* =========================
   АТАКА БОТА
========================= */

function enemyAttack() {

    if (gameOver) return;

    const now = Date.now();

    if (now - lastEnemyAttack < ATTACK_COOLDOWN) {
        return;
    }

    if (enemyAttacking) return;

    /*
       Бот не всегда атакует,
       даже если находится рядом.
    */

    if (Math.random() > 0.75) {
        return;
    }

    lastEnemyAttack = now;

    enemyAttacking = true;

    enemyImg.src = ENEMY_ATTACK;


    setTimeout(() => {

        if (gameOver) return;

        if (canHit()) {

            playerHP -= DAMAGE;

            playerHP = Math.max(0, playerHP);

            playerHPBar.style.width =
                playerHP + "%";

            hitEffect(player);

            if (playerHP <= 0) {
                finishGame(false);
            }
        }

    }, 250);


    setTimeout(() => {

        enemyAttacking = false;

        if (!gameOver) {
            enemyImg.src = ENEMY_IDLE;
        }

    }, ATTACK_DURATION);
}


/* =========================
   ИИ БОТА
========================= */

let botDecisionTimer = 0;

function botAI() {

    if (gameOver || enemyAttacking) return;

    const distance = getDistance();

    /*
       Если слишком далеко —
       бот идёт вперёд.
    */

    if (distance > 15) {

        enemyX -= 0.16;

    }

    /*
       Если слишком близко —
       иногда отходит назад.
    */

    else if (distance < 8) {

        if (Math.random() < 0.035) {
            enemyX += 0.25;
        }

    }

    /*
       На средней дистанции бот
       может немного двигаться.
    */

    else {

        const random = Math.random();

        if (random < 0.025) {
            enemyX -= 0.18;
        }

        else if (random < 0.045) {
            enemyX += 0.18;
        }
    }


    /*
       Иногда бот атакует,
       когда игрок рядом.
    */

    if (distance <= 13) {

        if (Math.random() < 0.035) {
            enemyAttack();
        }
    }


    /*
       Границы арены.
    */

    enemyX = Math.max(18, Math.min(88, enemyX));

    updatePositions();
}


/* =========================
   ЗАВЕРШЕНИЕ БОЯ
========================= */

function finishGame(playerWon) {

    gameOver = true;

    if (playerWon) {
        resultText.textContent = "ПОБЕДА!";
    } else {
        resultText.textContent = "ПОРАЖЕНИЕ";
    }

    result.style.display = "flex";
}


/* =========================
   ПЕРЕЗАПУСК
========================= */

document.getElementById("restart").addEventListener("click", () => {

    playerHP = MAX_HP;
    enemyHP = MAX_HP;

    playerX = 22;
    enemyX = 68;

    playerAttacking = false;
    enemyAttacking = false;

    lastPlayerAttack = 0;
    lastEnemyAttack = 0;

    gameOver = false;

    playerImg.src = PLAYER_IDLE;
    enemyImg.src = ENEMY_IDLE;

    playerHPBar.style.width = "100%";
    enemyHPBar.style.width = "100%";

    result.style.display = "none";

    updatePositions();
});


/* =========================
   КНОПКИ
========================= */

function holdButton(button, property) {

    button.addEventListener("pointerdown", (e) => {

        e.preventDefault();

        keys[property] = true;
    });

    button.addEventListener("pointerup", (e) => {

        e.preventDefault();

        keys[property] = false;
    });

    button.addEventListener("pointercancel", () => {
        keys[property] = false;
    });

    button.addEventListener("pointerleave", () => {
        keys[property] = false;
    });
}


holdButton(
    document.getElementById("left"),
    "left"
);

holdButton(
    document.getElementById("right"),
    "right"
);


/*
   Удар
*/

document.getElementById("attack")
    .addEventListener("pointerdown", (e) => {

        e.preventDefault();

        playerAttack();
    });


/*
   Блок пока ничего не делает.
*/

document.getElementById("block")
    .addEventListener("pointerdown", (e) => {

        e.preventDefault();

        // Блок будет добавлен позже.
    });


/* =========================
   КЛАВИАТУРА
========================= */

document.addEventListener("keydown", (e) => {

    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        keys.left = true;
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        keys.right = true;
    }

    if (e.key === " " || e.key.toLowerCase() === "f") {
        playerAttack();
    }
});


document.addEventListener("keyup", (e) => {

    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        keys.left = false;
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        keys.right = false;
    }
});


/* =========================
   ИГРОВОЙ ЦИКЛ
========================= */

function gameLoop() {

    movePlayer();

    botAI();

    requestAnimationFrame(gameLoop);
}


updatePositions();

gameLoop();

</script>

</body>
  </html>
