<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Prince Battle</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #111;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    body {
        display: flex;
        justify-content: center;
    }

    /* Вертикальная игровая область */
    #game {
        position: relative;
        width: 100%;
        max-width: 480px;
        height: 100vh;
        overflow: hidden;

        background:
            linear-gradient(
                to bottom,
                #75b8e8 0%,
                #a9d8f5 42%,
                #65a94d 43%,
                #4f8d3d 100%
            );
    }

    /* Поле */
    #arena {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
    }

    /* Земля */
    #ground {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 56%;
        background:
            repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.025) 0px,
                rgba(0,0,0,0.025) 3px,
                transparent 3px,
                transparent 9px
            );
    }

    /* Центральная линия */
    #centerLine {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 2px;
        background: rgba(255,255,255,0.12);
    }

    /* Персонажи */
    .character {
        position: absolute;
        bottom: 15%;
        width: 150px;
        height: 260px;

        display: flex;
        align-items: flex-end;
        justify-content: center;

        transition: left 0.05s linear;
        z-index: 10;
    }

    .character img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: bottom center;
        user-select: none;
        pointer-events: none;
    }

    #prince1 {
        left: -10px;
    }

    #prince2 {
        left: calc(100% - 140px);
    }

    /* Второй персонаж смотрит в противоположную сторону */
    #prince2 img {
        transform: scaleX(-1);
    }

    /* Полоски здоровья */
    .health {
        position: absolute;
        top: -15px;
        left: 15%;
        width: 70%;
        height: 9px;
        background: #333;
        border: 1px solid rgba(0,0,0,0.5);
        border-radius: 10px;
        overflow: hidden;
        z-index: 20;
    }

    .healthFill {
        width: 100%;
        height: 100%;
        background: #39c94a;
        transition: width 0.2s;
    }

    /* Текст сверху */
    #title {
        position: absolute;
        top: 18px;
        left: 0;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 22px;
        font-weight: bold;
        text-shadow: 0 2px 4px black;
        z-index: 50;
    }

    #status {
        position: absolute;
        top: 50px;
        left: 0;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 14px;
        text-shadow: 0 1px 3px black;
        z-index: 50;
    }

    #restart {
        position: absolute;
        left: 50%;
        bottom: 25px;
        transform: translateX(-50%);

        padding: 12px 24px;
        border: none;
        border-radius: 12px;

        background: #dcae32;
        color: white;
        font-size: 16px;
        font-weight: bold;

        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        z-index: 100;
    }

    #restart:active {
        transform: translateX(-50%) scale(0.95);
    }

    /* Удар */
    .attacking {
        animation: attackShake 0.15s ease;
    }

    @keyframes attackShake {
        0%   { transform: translateX(0); }
        50%  { transform: translateX(8px); }
        100% { transform: translateX(0); }
    }

    .hit {
        animation: hitEffect 0.2s ease;
    }

    @keyframes hitEffect {
        0%   { filter: brightness(1); }
        50%  { filter: brightness(2); }
        100% { filter: brightness(1); }
    }

    @media (max-width: 360px) {
        .character {
            width: 125px;
            height: 220px;
        }
    }
</style>
</head>

<body>

<div id="game">

    <div id="arena">

        <div id="ground"></div>
        <div id="centerLine"></div>

        <div id="title">PRINCE BATTLE</div>
        <div id="status">Принцы идут навстречу...</div>

        <!-- Принц 1 -->
        <div id="prince1" class="character">
            <div class="health">
                <div id="health1" class="healthFill"></div>
            </div>

            <img
                id="image1"
                src="file_0000000002cc82108334cd930a0614de.png"
                alt="Принц Чаминг"
            >
        </div>

        <!-- Принц 2 -->
        <div id="prince2" class="character">
            <div class="health">
                <div id="health2" class="healthFill"></div>
            </div>

            <img
                id="image2"
                src="file_0000000002cc82108334cd930a0614de.png"
                alt="Принц Чаминг"
            >
        </div>

        <button id="restart">Начать заново</button>

    </div>
</div>

<script>

const prince1 = document.getElementById("prince1");
const prince2 = document.getElementById("prince2");

const image1 = document.getElementById("image1");
const image2 = document.getElementById("image2");

const health1 = document.getElementById("health1");
const health2 = document.getElementById("health2");

const statusText = document.getElementById("status");
const restartButton = document.getElementById("restart");


/* =========================
   КАРТИНКИ
========================= */

const WALK =
    "file_0000000002cc82108334cd930a0614de.png";

const ATTACK_RIGHT =
    "file_000000006ac882119149f2745c978bc5.png";

const ATTACK_LEFT =
    "file_0000000051848210bb23dd96ab341430.png";


/* =========================
   НАСТРОЙКИ
========================= */

const WALK_SPEED = 0.65;

const ATTACK_DISTANCE = 115;

const DAMAGE = 15;

const ATTACK_COOLDOWN = 900;


/* =========================
   СОСТОЯНИЕ
========================= */

let pos1;
let pos2;

let hp1;
let hp2;

let lastAttack1 = 0;
let lastAttack2 = 0;

let fighting = false;
let gameOver = false;


/* =========================
   ЗАПУСК
========================= */

function startGame() {

    const width = document.getElementById("game").clientWidth;

    pos1 = -10;
    pos2 = width - 140;

    hp1 = 100;
    hp2 = 100;

    lastAttack1 = 0;
    lastAttack2 = 0;

    fighting = false;
    gameOver = false;

    image1.src = WALK;
    image2.src = WALK;

    image1.style.transform = "scaleX(1)";
    image2.style.transform = "scaleX(-1)";

    health1.style.width = "100%";
    health2.style.width = "100%";

    statusText.textContent = "Принцы идут навстречу...";

    updatePositions();
}


/* =========================
   ПОЗИЦИИ
========================= */

function updatePositions() {

    prince1.style.left = pos1 + "px";
    prince2.style.left = pos2 + "px";
}


/* =========================
   ОСНОВНОЙ ЦИКЛ
========================= */

function gameLoop(time) {

    if (gameOver) {
        requestAnimationFrame(gameLoop);
        return;
    }

    const distance = pos2 - pos1;


    /* Принцы идут навстречу */

    if (!fighting && distance > ATTACK_DISTANCE) {

        pos1 += WALK_SPEED;
        pos2 -= WALK_SPEED;

        updatePositions();
    }


    /* Начало боя */

    if (!fighting && distance <= ATTACK_DISTANCE) {

        fighting = true;

        statusText.textContent = "⚔️ БОЙ!";
    }


    /* Бой */

    if (fighting) {

        if (time - lastAttack1 > ATTACK_COOLDOWN) {

            attack1(time);
        }

        if (time - lastAttack2 > ATTACK_COOLDOWN + 350) {

            attack2(time);
        }
    }


    requestAnimationFrame(gameLoop);
}


/* =========================
   АТАКА ПЕРВОГО
========================= */

function attack1(time) {

    if (hp2 <= 0) return;

    lastAttack1 = time;

    image1.src = ATTACK_RIGHT;
    image1.style.transform = "scaleX(1)";

    prince1.classList.add("attacking");

    setTimeout(() => {

        if (gameOver) return;

        hp2 -= DAMAGE;

        if (hp2 < 0) hp2 = 0;

        health2.style.width = hp2 + "%";

        prince2.classList.add("hit");

        setTimeout(() => {
            prince2.classList.remove("hit");
        }, 200);

        image1.src = WALK;

        checkWinner();

    }, 250);

    setTimeout(() => {

        prince1.classList.remove("attacking");

    }, 200);
}


/* =========================
   АТАКА ВТОРОГО
========================= */

function attack2(time) {

    if (hp1 <= 0) return;

    lastAttack2 = time;

    image2.src = ATTACK_LEFT;

    image2.style.transform = "scaleX(1)";

    prince2.classList.add("attacking");

    setTimeout(() => {

        if (gameOver) return;

        hp1 -= DAMAGE;

        if (hp1 < 0) hp1 = 0;

        health1.style.width = hp1 + "%";

        prince1.classList.add("hit");

        setTimeout(() => {
            prince1.classList.remove("hit");
        }, 200);

        image2.src = WALK;

        image2.style.transform = "scaleX(-1)";

        checkWinner();

    }, 250);

    setTimeout(() => {

        prince2.classList.remove("attacking");

    }, 200);
}


/* =========================
   ПОБЕДИТЕЛЬ
========================= */

function checkWinner() {

    if (hp1 <= 0) {

        gameOver = true;

        statusText.textContent = "👑 Победил правый Принц!";
        image1.style.opacity = "0.4";

    }

    else if (hp2 <= 0) {

        gameOver = true;

        statusText.textContent = "👑 Победил левый Принц!";
        image2.style.opacity = "0.4";
    }
}


/* =========================
   ПЕРЕЗАПУСК
========================= */

restartButton.addEventListener("click", () => {

    image1.style.opacity = "1";
    image2.style.opacity = "1";

    startGame();
});


/* =========================
   СТАРТ
========================= */

startGame();

requestAnimationFrame(gameLoop);

</script>

</body>
  </html>
